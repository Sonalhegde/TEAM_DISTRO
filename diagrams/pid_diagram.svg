<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #475569; }
      .tank { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2.5; rx: 8; }
      .tank-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #0369a1; text-anchor: middle; }
      .tank-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #0284c7; text-anchor: middle; }
      .pipe-process { stroke: #0284c7; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .pipe-flush { stroke: #059669; stroke-width: 3.5; stroke-dasharray: 6,4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .pipe-signal { stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; }
      .pump { fill: #fed7aa; stroke: #ea580c; stroke-width: 2.5; }
      .pump-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #9a3412; text-anchor: middle; }
      .valve { fill: #fef08a; stroke: #ca8a04; stroke-width: 2; }
      .sensor { fill: #e0e7ff; stroke: #4f46e5; stroke-width: 2.5; }
      .sensor-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #3730a3; text-anchor: middle; }
      .controller { fill: #f1f5f9; stroke: #334155; stroke-width: 2; rx: 6; stroke-dasharray: 5,5; }
      .text-ctrl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
      .arrow { fill: #0284c7; }
      .arrow-flush { fill: #059669; }
      .legend-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 6; }
      .legend-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #334155; }
      .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #475569; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow" />
    </marker>
    <marker id="arrowhead-flush" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow-flush" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="700" class="bg" />

  <!-- Header Banner -->
  <text x="40" y="45" class="title">LAM RESEARCH CHALLENGE 3.0 | STAGE 2 - PROCESS PIPING &amp; INSTRUMENTATION DIAGRAM (P&amp;ID)</text>
  <text x="40" y="68" class="subtitle">TEAM DISTRO (LRC-26-0528) | Closed-Loop Fluid Handling, Sump Auto-Level Protection &amp; Automated Flush System</text>

  <!-- Border Frame -->
  <rect x="25" y="80" width="1050" height="595" fill="none" stroke="#94a3b8" stroke-width="1.5" rx="4" />

  <!-- ================= TANKS ================= -->
  <!-- 10L Main Process Tank (TK-01) -->
  <rect x="70" y="160" width="130" height="230" class="tank" />
  <text x="135" y="260" class="tank-label">10L PROCESS</text>
  <text x="135" y="280" class="tank-label">TANK-01</text>
  <text x="135" y="305" class="tank-sub">(Primary Reservoir)</text>

  <!-- 4.2L Sump Tank (TK-02) -->
  <rect x="510" y="270" width="120" height="170" class="tank" />
  <text x="570" y="345" class="tank-label">4.2L SUMP</text>
  <text x="570" y="365" class="tank-label">TANK-02</text>
  <text x="570" y="388" class="tank-sub">(Interm. Sump)</text>

  <!-- Float Switch in Sump (LS-01) -->
  <circle cx="570" cy="305" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
  <text x="570" y="309" font-family="'Segoe UI', Arial" font-size="9" font-weight="bold" fill="#b91c1c" text-anchor="middle">LS-01</text>
  <text x="570" y="285" class="tag">High Level Float</text>

  <!-- 4.2L Flush Water Tank (TK-03) -->
  <rect x="70" y="460" width="130" height="160" class="tank" style="stroke:#059669; fill:#d1fae5;" />
  <text x="135" y="535" class="tank-label" style="fill:#047857;">4.2L FLUSH</text>
  <text x="135" y="555" class="tank-label" style="fill:#047857;">TANK-03</text>
  <text x="135" y="578" class="tank-sub" style="fill:#059669;">(Flush Debris / Off)</text>

  <!-- ================= VALVES & ACTUATORS ================= -->
  <!-- Solenoid ON/OFF Valve (OV-01 / XV-01) at 10L Tank Outlet -->
  <polygon points="230,225 250,235 250,215" class="valve" />
  <polygon points="270,225 250,235 250,215" class="valve" />
  <rect x="244" y="200" width="12" height="15" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />
  <text x="250" y="193" class="tag">OV-01 (12V XV)</text>

  <!-- Manual Ball Valve BV-02 on Flush Line -->
  <polygon points="230,530 250,540 250,520" class="valve" />
  <polygon points="270,530 250,540 250,520" class="valve" />
  <circle cx="250" cy="515" r="4" fill="#ca8a04" />
  <line x1="250" y1="515" x2="250" y2="525" stroke="#ca8a04" stroke-width="2" />
  <text x="250" y="505" class="tag">BV-02 (Manual Flush)</text>

  <!-- ================= PUMPS ================= -->
  <!-- Pump-01 (P-01) Feed to Sump -->
  <circle cx="370" cy="225" r="26" class="pump" />
  <polygon points="360,208 385,225 360,242" fill="#ea580c" />
  <text x="370" y="270" class="pump-label">PUMP-01</text>
  <text x="370" y="285" class="tag">(50% Duty Cycle)</text>

  <!-- Pump-03 (P-03) Flush Pump -->
  <circle cx="370" cy="530" r="26" class="pump" style="stroke:#059669; fill:#a7f3d0;" />
  <polygon points="360,513 385,530 360,547" fill="#059669" />
  <text x="370" y="575" class="pump-label" style="fill:#047857;">PUMP-03</text>
  <text x="370" y="590" class="tag">(Flush Supply)</text>

  <!-- Pump-02 (P-02) Return Pump from Sump -->
  <circle cx="730" cy="385" r="26" class="pump" />
  <polygon points="720,368 745,385 720,402" fill="#ea580c" />
  <text x="730" y="430" class="pump-label">PUMP-02</text>
  <text x="730" y="445" class="tag">(100% Duty Cycle)</text>

  <!-- Equal Tee (TEE-01) joining Flush & Suction lines -->
  <circle cx="310" cy="225" r="7" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
  <text x="310" y="212" class="tag">8mm Tee</text>

  <!-- Flow Transmitter FT-01 -->
  <circle cx="890" cy="385" r="24" class="sensor" />
  <text x="890" y="383" class="sensor-label">FT-01</text>
  <text x="890" y="396" font-family="'Segoe UI', Arial" font-size="9" fill="#4338ca" text-anchor="middle">Flow Xmtr</text>
  <text x="890" y="425" class="tag">Pulse Output (Hall)</text>

  <!-- Ball Valve BV-01 Throttling / Isolation on return line -->
  <polygon points="970,385 990,395 990,375" class="valve" />
  <polygon points="1010,385 990,395 990,375" class="valve" />
  <circle cx="990" cy="370" r="4" fill="#ca8a04" />
  <line x1="990" y1="370" x2="990" y2="380" stroke="#ca8a04" stroke-width="2" />
  <text x="990" y="360" class="tag">BV-01 (Throttle Valve)</text>

  <!-- ================= PIPING PATHS ================= -->
  <!-- 10L Tank to Solenoid OV-01 -->
  <line x1="200" y1="225" x2="230" y2="225" class="pipe-process" marker-end="url(#arrowhead)" />
  <!-- OV-01 to Equal Tee -->
  <line x1="270" y1="225" x2="310" y2="225" class="pipe-process" />
  <!-- Tee to Pump-01 Suction -->
  <line x1="310" y1="225" x2="344" y2="225" class="pipe-process" marker-end="url(#arrowhead)" />
  <!-- Pump-01 Discharge to Sump TK-02 Inlet -->
  <path d="M 396 225 L 470 225 L 470 300 L 510 300" class="pipe-process" marker-end="url(#arrowhead)" />
  
  <!-- Flush Tank TK-03 to BV-02 -->
  <line x1="200" y1="530" x2="230" y2="530" class="pipe-flush" marker-end="url(#arrowhead-flush)" />
  <!-- BV-02 to Pump-03 Suction -->
  <line x1="270" y1="530" x2="344" y2="530" class="pipe-flush" marker-end="url(#arrowhead-flush)" />
  <!-- Pump-03 Discharge to Equal Tee -->
  <path d="M 396 530 L 430 530 L 430 470 L 310 470 L 310 232" class="pipe-flush" marker-end="url(#arrowhead-flush)" />

  <!-- Sump Outlet to Pump-02 Suction -->
  <line x1="630" y1="385" x2="704" y2="385" class="pipe-process" marker-end="url(#arrowhead)" />
  <!-- Pump-02 Discharge to FT-01 -->
  <line x1="756" y1="385" x2="866" y2="385" class="pipe-process" marker-end="url(#arrowhead)" />
  <!-- FT-01 to BV-01 -->
  <line x1="914" y1="385" x2="970" y2="385" class="pipe-process" marker-end="url(#arrowhead)" />
  <!-- BV-01 Recirculation line back to 10L Tank -->
  <path d="M 1010 385 L 1040 385 L 1040 120 L 135 120 L 135 160" class="pipe-process" marker-end="url(#arrowhead)" />

  <!-- External Fluid Charging Port into Sump (Perturbation point) -->
  <path d="M 570 190 L 570 260" stroke="#f97316" stroke-width="3" stroke-dasharray="4,3" fill="none" marker-end="url(#arrowhead)" />
  <rect x="520" y="160" width="100" height="25" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" rx="3" />
  <text x="570" y="177" font-family="'Segoe UI', Arial" font-size="10" font-weight="bold" fill="#c2410c" text-anchor="middle">EXT. FLUID CHARGE</text>

  <!-- ================= CONTROLLER & ELECTRONICS ================= -->
  <rect x="660" y="150" width="220" height="150" class="controller" />
  <text x="770" y="175" class="text-ctrl">ESP32 / PCB CONTROLLER</text>
  <text x="770" y="195" font-family="'Segoe UI', Arial" font-size="10" fill="#475569" text-anchor="middle">12V SMPS Supply | FreeRTOS State Engine</text>

  <!-- Signal Lines from Controller -->
  <!-- to P-01 (PWM) -->
  <path d="M 660 210 L 370 210 L 370 199" class="pipe-signal" />
  <text x="440" y="204" font-family="'Segoe UI', Arial" font-size="9" fill="#dc2626">PWM-01 (50%)</text>

  <!-- to P-02 (PWM) -->
  <path d="M 730 300 L 730 359" class="pipe-signal" />
  <text x="735" y="330" font-family="'Segoe UI', Arial" font-size="9" fill="#dc2626">PWM-02 (100%)</text>

  <!-- to P-03 (PWM) -->
  <path d="M 680 300 L 680 500 L 370 500 L 370 504" class="pipe-signal" />
  <text x="520" y="495" font-family="'Segoe UI', Arial" font-size="9" fill="#dc2626">PWM-03 (Flush)</text>

  <!-- to OV-01 (12V Relay/MOSFET) -->
  <path d="M 660 235 L 250 235 L 250 215" class="pipe-signal" />
  <text x="280" y="248" font-family="'Segoe UI', Arial" font-size="9" fill="#dc2626">OV-01 Ctrl</text>

  <!-- from LS-01 Float Switch -->
  <path d="M 584 305 L 660 305 L 660 280" class="pipe-signal" />
  <text x="618" y="298" font-family="'Segoe UI', Arial" font-size="9" fill="#dc2626">FSW Input</text>

  <!-- from FT-01 Flow Sensor -->
  <path d="M 880 361 L 880 270 L 880 270" class="pipe-signal" />
  <text x="890" y="325" font-family="'Segoe UI', Arial" font-size="9" fill="#dc2626">Pulse (f_in)</text>

  <!-- ================= LEGEND BOX ================= -->
  <rect x="40" y="630" width="1020" height="40" class="legend-box" />
  <line x1="60" y1="650" x2="95" y2="650" class="pipe-process" />
  <text x="105" y="654" class="legend-text">8mm Recirculation Line (Case 1)</text>

  <line x1="280" y1="650" x2="315" y2="650" class="pipe-flush" />
  <text x="325" y="654" class="legend-text">8mm Flush / Drain Line (Case 2)</text>

  <line x1="500" y1="650" x2="535" y2="650" class="pipe-signal" />
  <text x="545" y="654" class="legend-text">Electrical / Sensor / PWM Control Line</text>

  <circle cx="760" cy="650" r="7" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5" />
  <text x="775" y="654" class="legend-text">Pump-01/02/03</text>

  <polygon points="860,650 870,656 870,644" class="valve" />
  <polygon points="880,650 870,656 870,644" class="valve" />
  <text x="888" y="654" class="legend-text">Valve (Solenoid / Ball)</text>

  <circle cx="980" cy="650" r="7" class="sensor" />
  <text x="993" y="654" class="legend-text">FT-01 Flow Sensor</text>
</svg>
