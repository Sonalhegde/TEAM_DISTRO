<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .header-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; }
      .header-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #64748b; }
      .pcb-board { fill: #064e3b; stroke: #047857; stroke-width: 3; rx: 10; }
      .ic-chip { fill: #1e293b; stroke: #475569; stroke-width: 2; rx: 4; }
      .ic-text { font-family: 'Courier New', monospace; font-size: 11px; fill: #38bdf8; font-weight: bold; text-anchor: middle; }
      .ic-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9px; fill: #94a3b8; text-anchor: middle; }
      .module-box { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; rx: 5; }
      .module-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .wire-12v { stroke: #dc2626; stroke-width: 2.5; fill: none; }
      .wire-gnd { stroke: #1e293b; stroke-width: 2.5; fill: none; }
      .wire-signal { stroke: #2563eb; stroke-width: 1.8; stroke-dasharray: 4,3; fill: none; }
      .wire-pwm { stroke: #d97706; stroke-width: 2; fill: none; }
      .terminal { fill: #fbbf24; stroke: #b45309; stroke-width: 1.5; rx: 2; }
      .term-text { font-family: 'Courier New', monospace; font-size: 9px; font-weight: bold; fill: #78350f; text-anchor: middle; }
      .pin-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9px; fill: #334155; }
    </style>
  </defs>

  <rect width="1000" height="650" class="bg" />

  <!-- Title -->
  <text x="30" y="35" class="header-title">ELECTRICAL WIRING &amp; INTERCONNECT SCHEMATIC</text>
  <text x="30" y="55" class="header-sub">Custom 12V Control PCB, ESP32 NodeMCU Module (U7), Motor Drivers (U2, U3, U4) &amp; Instrumentation Interfaces</text>

  <!-- External 12V SMPS Box -->
  <rect x="40" y="90" width="130" height="85" class="module-box" style="fill:#fee2e2; stroke:#ef4444;" />
  <text x="105" y="115" class="module-title" style="fill:#b91c1c;">12V DC SMPS</text>
  <text x="105" y="132" class="ic-sub" style="fill:#7f1d1d;">Mains 220V Input</text>
  <text x="105" y="150" font-family="'Segoe UI', Arial" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">Outputs: +12V, GND</text>

  <!-- External On/Off Switch -->
  <rect x="40" y="215" width="130" height="70" class="module-box" style="fill:#fef3c7; stroke:#d97706;" />
  <text x="105" y="240" class="module-title" style="fill:#92400e;">ON/OFF SWITCH</text>
  <text x="105" y="260" class="ic-sub" style="fill:#b45309;">Main Master Run Switch</text>
  <text x="105" y="275" font-family="'Segoe UI', Arial" font-size="9" fill="#78350f" text-anchor="middle">(SW / GND)</text>

  <!-- ================= CUSTOM PCB ENCLOSURE ================= -->
  <rect x="220" y="80" width="530" height="530" class="pcb-board" />
  <text x="485" y="105" font-family="'Segoe UI', Arial" font-size="14" font-weight="bold" fill="#a7f3d0" text-anchor="middle">LAM 3.0 CUSTOM AUTOMATION PCB (12V DC DOMAIN)</text>

  <!-- 12V Input Terminal -->
  <rect x="235" y="120" width="55" height="40" class="terminal" />
  <text x="262" y="145" class="term-text">12V IN</text>

  <!-- ON/OFF Switch Terminal -->
  <rect x="235" y="230" width="55" height="40" class="terminal" />
  <text x="262" y="255" class="term-text">SW-IN</text>

  <!-- Voltage Regulator (12V -> 5V / 3.3V) -->
  <rect x="330" y="120" width="70" height="45" class="ic-chip" />
  <text x="365" y="145" class="ic-text">LM2596 /</text>
  <text x="365" y="158" class="ic-text">AMS1117</text>

  <!-- ESP32 NodeMCU Module (U7) -->
  <rect x="320" y="200" width="180" height="240" class="ic-chip" style="fill:#0f172a; stroke:#38bdf8;" />
  <text x="410" y="225" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">ESP32 NODEMCU</text>
  <text x="410" y="242" class="ic-sub">Dual Core Xtensa 240MHz</text>

  <!-- ESP32 GPIO Pins -->
  <!-- Left Side Pins -->
  <text x="330" y="275" font-family="'Courier New'" font-size="9" fill="#93c5fd">GPIO 34 (FSW)</text>
  <text x="330" y="305" font-family="'Courier New'" font-size="9" fill="#93c5fd">GPIO 35 (FT-01)</text>
  <text x="330" y="335" font-family="'Courier New'" font-size="9" fill="#93c5fd">GPIO 32 (RUN_SW)</text>
  <text x="330" y="365" font-family="'Courier New'" font-size="9" fill="#93c5fd">GPIO 25 (OV-01)</text>

  <!-- Right Side Pins -->
  <text x="420" y="275" font-family="'Courier New'" font-size="9" fill="#fde047">GPIO 18 (PWM1)</text>
  <text x="420" y="305" font-family="'Courier New'" font-size="9" fill="#fde047">GPIO 19 (PWM2)</text>
  <text x="420" y="335" font-family="'Courier New'" font-size="9" fill="#fde047">GPIO 21 (PWM3)</text>
  <text x="420" y="365" font-family="'Courier New'" font-size="9" fill="#93c5fd">GPIO 22/23 (EN)</text>

  <!-- Motor Drivers U2, U3, U4 -->
  <!-- U2: Pump-01 Driver -->
  <rect x="560" y="140" width="160" height="80" class="module-box" style="fill:#fed7aa; stroke:#ea580c;" />
  <text x="640" y="165" class="module-title" style="fill:#9a3412;">DRIVER U2 (Pump-1)</text>
  <text x="640" y="180" class="ic-sub">PWM In | 12V 2A H-Bridge</text>
  <text x="640" y="200" font-family="'Courier New'" font-size="9" fill="#9a3412" text-anchor="middle">OUT: P1_PWM (50% Duty)</text>

  <!-- U3: Pump-02 Driver -->
  <rect x="560" y="245" width="160" height="80" class="module-box" style="fill:#fed7aa; stroke:#ea580c;" />
  <text x="640" y="270" class="module-title" style="fill:#9a3412;">DRIVER U3 (Pump-2)</text>
  <text x="640" y="285" class="ic-sub">PWM In | 12V 2A H-Bridge</text>
  <text x="640" y="305" font-family="'Courier New'" font-size="9" fill="#9a3412" text-anchor="middle">OUT: P2_PWM (100% Duty)</text>

  <!-- U4: Pump-03 Driver -->
  <rect x="560" y="350" width="160" height="80" class="module-box" style="fill:#fed7aa; stroke:#ea580c;" />
  <text x="640" y="375" class="module-title" style="fill:#9a3412;">DRIVER U4 (Pump-3)</text>
  <text x="640" y="390" class="ic-sub">PWM In | 12V 2A H-Bridge</text>
  <text x="640" y="410" font-family="'Courier New'" font-size="9" fill="#9a3412" text-anchor="middle">OUT: P3_PWM (Flush)</text>

  <!-- Solenoid Valve Driver / Relay / MOSFET -->
  <rect x="560" y="455" width="160" height="70" class="module-box" style="fill:#fef08a; stroke:#ca8a04;" />
  <text x="640" y="480" class="module-title" style="fill:#854d0e;">SOLENOID DRIVER (OV-01)</text>
  <text x="640" y="495" class="ic-sub">Flyback Diode Protected</text>
  <text x="640" y="512" font-family="'Courier New'" font-size="9" fill="#854d0e" text-anchor="middle">12V Solenoid Interface</text>

  <!-- Flow Sensor Connector Terminal -->
  <rect x="235" y="465" width="70" height="40" class="terminal" />
  <text x="270" y="485" class="term-text">FT-01 S/V/G</text>
  <text x="270" y="497" font-family="'Segoe UI', Arial" font-size="8" fill="#78350f" text-anchor="middle">Pull-up 4.7kΩ</text>

  <!-- Float Switch Connector Terminal -->
  <rect x="235" y="530" width="70" height="40" class="terminal" />
  <text x="270" y="550" class="term-text">FSW / GND</text>
  <text x="270" y="562" font-family="'Segoe UI', Arial" font-size="8" fill="#78350f" text-anchor="middle">Int. Pull-up</text>

  <!-- ================= EXTERNAL FIELD DEVICES ================= -->
  <!-- Pump 1 External Motor -->
  <rect x="800" y="145" width="150" height="70" class="module-box" />
  <text x="875" y="170" class="module-title">PUMP-01 (12V DC)</text>
  <text x="875" y="188" class="ic-sub">10L Tank -> Sump Line</text>

  <!-- Pump 2 External Motor -->
  <rect x="800" y="250" width="150" height="70" class="module-box" />
  <text x="875" y="275" class="module-title">PUMP-02 (12V DC)</text>
  <text x="875" y="293" class="ic-sub">Sump -> Recirc Line</text>

  <!-- Pump 3 External Motor -->
  <rect x="800" y="355" width="150" height="70" class="module-box" />
  <text x="875" y="380" class="module-title">PUMP-03 (12V DC)</text>
  <text x="875" y="398" class="ic-sub">Flush Fluid Line</text>

  <!-- Solenoid Valve OV-01 -->
  <rect x="800" y="455" width="150" height="65" class="module-box" />
  <text x="875" y="480" class="module-title">SOLENOID OV-01</text>
  <text x="875" y="498" class="ic-sub">Isolation Valve (12V)</text>

  <!-- Flow Sensor FT-01 Field Device -->
  <rect x="40" y="450" width="130" height="70" class="module-box" style="fill:#e0e7ff; stroke:#4f46e5;" />
  <text x="105" y="475" class="module-title" style="fill:#3730a3;">FT-01 SENSOR</text>
  <text x="105" y="492" class="ic-sub">Hall Effect Turbine</text>
  <text x="105" y="507" font-family="'Courier New'" font-size="9" fill="#312e81" text-anchor="middle">5V, GND, Pulse OUT</text>

  <!-- Float Switch Field Device -->
  <rect x="40" y="540" width="130" height="65" class="module-box" style="fill:#fee2e2; stroke:#dc2626;" />
  <text x="105" y="565" class="module-title" style="fill:#991b1b;">FLOAT SWITCH</text>
  <text x="105" y="582" class="ic-sub">Sump Reed / Magnet</text>
  <text x="105" y="597" font-family="'Courier New'" font-size="9" fill="#7f1d1d" text-anchor="middle">Dry Contact (NO)</text>

  <!-- ================= WIRING CONNECTIONS ================= -->
  <!-- 12V SMPS to PCB 12V IN -->
  <line x1="170" y1="130" x2="235" y2="130" class="wire-12v" />
  <line x1="170" y1="150" x2="235" y2="150" class="wire-gnd" />

  <!-- Switch to PCB SW-IN -->
  <line x1="170" y1="250" x2="235" y2="250" class="wire-signal" />

  <!-- Flow sensor to Terminal -->
  <line x1="170" y1="485" x2="235" y2="485" class="wire-signal" />

  <!-- Float switch to Terminal -->
  <line x1="170" y1="550" x2="235" y2="550" class="wire-signal" />

  <!-- Drivers to Motors -->
  <line x1="720" y1="180" x2="800" y2="180" class="wire-pwm" />
  <line x1="720" y1="285" x2="800" y2="285" class="wire-pwm" />
  <line x1="720" y1="390" x2="800" y2="390" class="wire-pwm" />
  <line x1="720" y1="490" x2="800" y2="490" class="wire-12v" />
</svg>
